name: CI

# PAUSED. This workflow is sound and has been verified locally, but the
# GitHub account is currently billing-locked, so Actions refuses to start
# any job (0 steps executed, 0 ms billable). Rather than paint the repo red
# for a reason unrelated to the code, it only runs when triggered by hand.
#
# TO RE-ENABLE once billing is sorted, replace `workflow_dispatch` below with:
#
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
#
# and restore the CI badge at the top of README.md.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  database:
    name: Schema and seed
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arena
          POSTGRES_PASSWORD: arena
          POSTGRES_DB: arena
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arena -d arena"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://arena:arena@localhost:5432/arena
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply schema
        run: npm run db:migrate

      - name: Apply schema again (must be idempotent)
        run: npm run db:migrate

      - name: Seed demo data
        run: npm run db:seed

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t open-source-tracker:ci .
